[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "editor-helper"
version = "0.1.0"
description = "Local AI segmentation and PSD import service"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi", "uvicorn", "python-multipart", "pillow", "numpy", "psd-tools"]

[project.optional-dependencies]
ai = ["torch", "torchvision", "timm"]
test = ["httpx", "coverage==7.16.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F401", "F841", "I"]
